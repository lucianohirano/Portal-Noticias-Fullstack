<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de notícias</title>
    <link rel="stylesheet" href="styles/index.css">

    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="container">
        <nav id="menu-primary">
            <div>
                <img src="assets/icons/List.svg" alt="menu">
                <strong>Menu</strong>
            </div>

            <img id="logo" src="assets/Logo.svg" alt="logo" />

            <div>
                <strong>Buscar</strong>
                <img src="assets/icons/MagnifyingGlass.svg" alt="buscar">
            </div>
        </nav>
        <nav id="menu-secondary">
            <a href="#">Inteligência Artificial</a>
            <a href="#">Blockchain</a>
            <a href="#">Hologramas</a>
            <a href="#">Internet</a>
            <a href="#">Vestíveis</a>
            <a href="#">Realidade Aumentada</a>
            <a href="#">Realidade Virtual</a>
        </nav>
    </header>

    <main class="container grid">
        <section id="featured" class="grid grid-flow-col gap-16">
            <figure class="card">
                <img src="assets/images/Image 01.png" alt="destaque">
                <figcaption>
                    <span class="content-tag">Robótica</span>
                    <h2 class="text-2xl">
                        Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.
                    </h2>
                </figcaption>
            </figure>
            <div class="grid gap-16 grid-col-2">
                <div class="card"><img src="assets/images/Image 02.png"></div>
                <div class="card"><img src="assets/images/Image 03.png">
                </div>
                <div class="card"><img src="assets/images/Image 04.png"></div>
                <div class="card"><img src="assets/images/Image 05.png"></div>
            </div>
        </section>
    </main>
</body>

</html>
